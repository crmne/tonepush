<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- A stompbox on the wire, lit amber, the way the editor draws a block.
       Filled rather than outlined so it still reads at 16 and 32 pixels.
       The website (tonepush.rocks) uses the same mark. -->
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3c45c"/><stop offset="1" stop-color="#d89a2b"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e2229"/><stop offset="1" stop-color="#121418"/></linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#panel)"/>
  <path d="M0 70h28M100 70h28" stroke="#4a505c" stroke-width="8"/>
  <rect x="28" y="18" width="72" height="94" rx="14" fill="url(#amber)"/>
  <circle cx="48" cy="40" r="9" fill="#121418"/>
  <circle cx="80" cy="40" r="9" fill="#121418"/>
  <path d="M48 40l-4-6M80 40l4-6" stroke="#f3c45c" stroke-width="3" stroke-linecap="round"/>
  <circle cx="64" cy="84" r="15" fill="#121418"/>
  <circle cx="64" cy="84" r="7" fill="#3a404b"/>
</svg>
