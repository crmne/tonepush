name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # A native arm64 runner, so the GUI's system libraries need no
          # cross-compilation sysroot.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # Cross-compiled from x64: the MSVC arm64 linker ships with the
          # runner's Visual Studio, and unlike Linux there is no system
          # library sysroot to assemble.
          - os: windows-latest
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # The repository pins its toolchain, and rustup resolves that pin the
      # moment cargo runs inside the checkout - a toolchain the setup step
      # above never added the cross-target's standard library to. Adding it
      # here, inside the checkout, lands it on the toolchain actually used.
      - run: rustup target add ${{ matrix.target }}
      - name: GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The two binaries, and not the whole workspace: hx-ruby is a Ruby
      # extension that links against libruby, which a release runner has no
      # reason to have. Building it here fails on Windows, where rb-sys cannot
      # generate bindings, and on macOS, where the cross-target link finds no
      # Ruby symbols. Nothing shipped in a release comes from it.
      - run: cargo build --release -p tonepush-cli -p tonepush-gui --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          name="tonepush-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/tonepush.exe" "dist/$name/"
            cp "target/${{ matrix.target }}/release/tonepush-gui.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/tonepush" "dist/$name/"
            cp "target/${{ matrix.target }}/release/tonepush-gui" "dist/$name/"
          fi
          cp README.md LICENSE "dist/$name/"
          if [ "${{ runner.os }}" = "Linux" ]; then
            # Desktop integration for package builds and hand-installs.
            cp --parents packaging/applications/tonepush.desktop packaging/icons/tonepush.svg packaging/udev/70-line6-hx.rules "dist/$name/"
          fi
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  macos:
    name: macOS universal app
    runs-on: macos-latest
    env:
      # Signing and notarization run only when the Apple credentials exist as
      # repository secrets; without them the DMG ships unsigned and the
      # download page explains the right-click dance.
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-universal

      - name: Build both architectures
        run: |
          cargo build --release -p tonepush-cli -p tonepush-gui --target aarch64-apple-darwin
          cargo build --release -p tonepush-cli -p tonepush-gui --target x86_64-apple-darwin

      - name: Universal binaries
        run: |
          mkdir -p universal
          lipo -create \
            target/aarch64-apple-darwin/release/tonepush \
            target/x86_64-apple-darwin/release/tonepush \
            -output universal/tonepush
          lipo -create \
            target/aarch64-apple-darwin/release/tonepush-gui \
            target/x86_64-apple-darwin/release/tonepush-gui \
            -output universal/tonepush-gui

      - name: App bundle
        run: |
          version="${GITHUB_REF_NAME#v}"
          bash packaging/macos/bundle.sh universal/tonepush-gui TonePush.app "$version"

      - name: Import signing certificate
        if: env.APPLE_CERTIFICATE_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p ci "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k ci "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain

      - name: Sign
        if: env.APPLE_CERTIFICATE_P12 != ''
        run: |
          codesign --force --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" universal/tonepush
          codesign --force --deep --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" TonePush.app

      - name: DMG
        run: |
          name="tonepush-${GITHUB_REF_NAME}-macos-universal"
          stage="$RUNNER_TEMP/dmg"
          mkdir -p "$stage"
          cp -R TonePush.app "$stage/"
          cp universal/tonepush "$stage/tonepush"
          cp README.md LICENSE "$stage/"
          ln -s /Applications "$stage/Applications"
          mkdir -p dist
          hdiutil create -volname TonePush -srcfolder "$stage" -ov \
            -format UDZO "dist/$name.dmg"

      - name: Notarize
        if: env.APPLE_CERTIFICATE_P12 != ''
        run: |
          name="tonepush-${GITHUB_REF_NAME}-macos-universal"
          xcrun notarytool submit "dist/$name.dmg" --wait \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"
          xcrun stapler staple "dist/$name.dmg"

      - name: Universal tarball
        run: |
          name="tonepush-${GITHUB_REF_NAME}-macos-universal"
          mkdir -p "dist/$name"
          cp universal/tonepush universal/tonepush-gui README.md LICENSE "dist/$name/"
          tar czf "dist/$name.tar.gz" -C dist "$name"
          rm -r "dist/$name"

      - uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          path: |
            dist/*.dmg
            dist/*.tar.gz
          if-no-files-found: error

  vendor:
    name: vendored dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Source-based distro builds must not fetch crates from the network.
      # This archive plus `cargo build --offline` is the whole story; see
      # PACKAGING.md.
      - name: Vendor
        run: |
          name="tonepush-${GITHUB_REF_NAME}-vendor"
          cargo vendor "$name/vendor" > vendor-config.toml
          mkdir -p "$name/.cargo"
          cp vendor-config.toml "$name/.cargo/config.toml"
          cp Cargo.lock "$name/Cargo.lock"
          mkdir -p dist
          tar cJf "dist/$name.tar.xz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: vendor
          path: dist/*.tar.xz
          if-no-files-found: error

  # The Ruby extension is compiled on the installing machine against these two
  # crates, so they have to exist on crates.io before the gem is any use to
  # anybody. hx-proto goes first because hx-catalog depends on it and cargo
  # verifies the package against the real index, not the working tree.
  crates:
    name: crates.io
    runs-on: ubuntu-latest
    outputs:
      # Whether both crates are on crates.io at this version by the time this
      # job is done, however they got there. The gem is only worth publishing
      # if they are.
      available: ${{ steps.confirm.outputs.available }}
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      # Absent rather than failed, the same way the macOS signing above treats
      # its certificate: a release without the token still builds every binary
      # and cuts the GitHub release, and simply does not publish.
      - name: Publish
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: |
          set -euo pipefail
          source .github/crates-io.sh
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          for crate in hx-proto hx-catalog; do
            # A re-run of a release must not fail on what it already did.
            if published "$crate" "$version"; then
              echo "${crate} ${version} is already published"
            else
              # --no-verify would skip building the package; it is left on so
              # a crate that cannot compile from its own published sources
              # fails here rather than on somebody's machine.
              cargo publish -p "$crate"
            fi

            # hx-catalog is verified against the registry copy of hx-proto,
            # not the workspace path. The API can report a successful upload
            # several seconds before Cargo's index can resolve it, and the new
            # catalog may use APIs introduced at this exact version.
            if [ "$crate" = hx-proto ]; then
              for attempt in $(seq 1 30); do
                registry_resolves "$crate" "$version" && break
                sleep 10
              done
              if ! registry_resolves "$crate" "$version"; then
                echo "::error::${crate} ${version} is not resolvable after five minutes"
                exit 1
              fi
            fi
          done

      - name: Confirm both are on crates.io
        id: confirm
        run: |
          set -euo pipefail
          source .github/crates-io.sh
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          available=true
          for crate in hx-proto hx-catalog; do
            # The index lags the upload by a few seconds, so this waits rather
            # than deciding on the first answer. The first release published
            # both crates and then declared them missing one second later.
            for attempt in $(seq 1 30); do
              published "$crate" "$version" && break
              sleep 10
            done
            if published "$crate" "$version"; then
              echo "${crate} ${version}: present"
            else
              echo "${crate} ${version}: missing after five minutes"
              available=false
            fi
          done
          echo "available=${available}" >> "$GITHUB_OUTPUT"
          if [ "$available" = false ]; then
            echo "::notice::hx_ruby will not be published: its crates are not on" \
                 "crates.io at this version. Set CARGO_REGISTRY_TOKEN to publish them."
          fi

  gem:
    name: RubyGems
    needs: [crates]
    # A gem whose crates are not published installs for nobody, so it is better
    # not to have been published at all than to be broken on RubyGems for ever.
    if: needs.crates.outputs.available == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: crates/hx-ruby
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - uses: dtolnay/rust-toolchain@stable

      - name: Check whether this version needs publishing
        id: check
        run: |
          set -euo pipefail
          version="$(ruby -Ilib -rhx_ruby/version -e 'puts HxRuby::VERSION')"
          echo "Local version: $version"
          published="$(gem list ^hx_ruby$ -r --all 2>/dev/null \
            | sed -n 's/.*(\(.*\)).*/\1/p' | tr ',' '\n' \
            | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep . | sort -u || true)"
          if echo "$published" | grep -Fxq "$version"; then
            echo "already published"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      # The gem ships sources, so this proves the extension still compiles from
      # exactly what is in the package before the package is pushed anywhere.
      - name: Build and smoke-test the gem
        if: steps.check.outputs.needed == 'true'
        run: |
          set -euo pipefail
          gem build hx_ruby.gemspec
          gem install ./hx_ruby-*.gem
          ruby -rhx_ruby -e 'puts "hx_ruby #{HxRuby::VERSION} loaded"'

      - name: Publish to GitHub Packages
        if: steps.check.outputs.needed == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gem"
          touch "$HOME/.gem/credentials"
          chmod 0600 "$HOME/.gem/credentials"
          printf -- "---\n:github: %s\n" "$GEM_HOST_API_KEY" > "$HOME/.gem/credentials"
          gem push --KEY github \
            --host "https://rubygems.pkg.github.com/${OWNER}" hx_ruby-*.gem
        env:
          GEM_HOST_API_KEY: "Bearer ${{ secrets.GITHUB_TOKEN }}"
          OWNER: ${{ github.repository_owner }}

      - name: Publish to RubyGems
        if: steps.check.outputs.needed == 'true' && env.GEM_HOST_API_KEY != ''
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gem"
          touch "$HOME/.gem/credentials"
          chmod 0600 "$HOME/.gem/credentials"
          printf -- "---\n:rubygems_api_key: %s\n" "$GEM_HOST_API_KEY" > "$HOME/.gem/credentials"
          gem push hx_ruby-*.gem
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_AUTH_TOKEN }}

  release:
    needs: [build, macos, vendor]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
      - name: The version, without the tag's v
        id: version
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        with:
          # Named rather than left to default to the tag, so the releases page
          # reads as a list of versions of a program rather than a list of tags.
          # Every earlier release is titled this way.
          name: TonePush ${{ steps.version.outputs.number }}
          files: dist/*
          generate_release_notes: true
          draft: false

  packaging:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: release
    uses: ./.github/workflows/packaging.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit
