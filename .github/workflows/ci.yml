name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      # After the toolchain, so the cache key follows the pinned rustc. The
      # key carries no job name, so each job sets its own generation. Saves
      # only on pushes to main; pull requests restore.
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: test-v1
      # The hardware integration tests are #[ignore]d; nothing here needs a device.
      - name: Test workspace
        if: runner.os != 'Windows'
        run: mbx test --workspace
      - name: Test workspace without the Rails extension
        if: runner.os == 'Windows'
        run: mbx test --workspace --exclude hx-ruby

  # The Windows packages, installed for real with stand-in program files: the
  # Inno Setup installer, the MSI taking it over, an update, and uninstalling
  # with TonePush running and without. Releases build both from these files.
  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - name: WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.Util.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:USERPROFILE\.dotnet\tools" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Install, update and remove
        shell: pwsh
        run: pwsh packaging/windows/test-installer.ps1
      # The release's own path to the package: native-packages checks the
      # input's executables are x64 PE files, so system ones stand in.
      - name: Package as the release does
        shell: pwsh
        run: |
          gem install native-packages --version 0.11.0 --no-document
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $payload = "dist\windows-input-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force $payload | Out-Null
          Copy-Item "$env:SystemRoot\System32\PING.EXE" "$payload\tonepush-gui.exe"
          Copy-Item "$env:SystemRoot\System32\PING.EXE" "$payload\tonepush.exe"
          Copy-Item README.md, LICENSE, packaging\windows\tonepush-installer.txt $payload
          native-packages build --version 0.0.1 --target windows-amd64 `
            --defer-recipes --output "$env:RUNNER_TEMP\windows-packages"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem "$env:RUNNER_TEMP\windows-packages\packages\windows-amd64\msi\tonepush-v0.0.1-x86_64-pc-windows-msvc.msi"

  # `cargo test --workspace` compiles the extension, which says nothing about
  # whether the *gem* is still shippable: the package carries only the files the
  # gemspec lists, and its Cargo.toml has to resolve with no workspace around
  # it. Building and loading it here is what catches a manifest that only works
  # in this checkout.
  gem:
    name: gem
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/hx-ruby
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - uses: dtolnay/rust-toolchain@stable
      # ext/hx_ruby/Cargo.toml is copied into the gem and compiled where there is
      # no workspace and no sibling crate. Anything that only resolves inside
      # this checkout - a path dependency, or a value inherited from the
      # workspace - is an error there and nowhere else, which is how one reached
      # a release: `edition.workspace = true` built fine here and failed with
      # "failed to find a workspace root" the moment the gem was installed.
      - name: The gem's manifest stands on its own
        run: |
          set -euo pipefail
          fail=0
          if grep -nE '^[^#]*path *=' ext/hx_ruby/Cargo.toml; then
            echo "^ path dependency: points at nothing once the gem is unpacked" >&2
            fail=1
          fi
          if grep -nE '^[^#]*workspace *= *true|^[^#]*\.workspace' ext/hx_ruby/Cargo.toml; then
            echo "^ workspace inheritance: there is no workspace to inherit from" >&2
            fail=1
          fi
          exit $fail
      # Three places say the version, and the two that are written by hand drift
      # silently. The gem installs the crates by version, so a mismatch resolves
      # against whatever was last published rather than what is in this commit.
      - name: Every version agrees
        run: |
          set -euo pipefail
          workspace="$(sed -n 's/^version = "\(.*\)"/\1/p' ../../Cargo.toml | head -1)"
          gem="$(ruby -Ilib -rhx_ruby/version -e 'puts HxRuby::VERSION')"
          ext="$(sed -n 's/^version = "\(.*\)"/\1/p' ext/hx_ruby/Cargo.toml | head -1)"
          echo "workspace=$workspace gem=$gem ext=$ext"
          for dep in hx-catalog hx-proto; do
            want="$(sed -n "s/^${dep} = \"\(.*\)\"/\1/p" ext/hx_ruby/Cargo.toml)"
            [ "$want" = "$workspace" ] || {
              echo "ext depends on $dep $want, workspace is at $workspace" >&2
              exit 1
            }
          done
          [ "$gem" = "$workspace" ] && [ "$ext" = "$workspace" ] || {
            echo "versions disagree" >&2
            exit 1
          }
      # Only that the package builds. Installing it would compile against the
      # crates.io copies of hx-catalog and hx-proto, which for the version being
      # developed do not exist until that version is released - so the real
      # standalone install is done by the release workflow, before it pushes,
      # which is the earliest moment it can mean anything.
      - name: Build the package
        run: gem build hx_ruby.gemspec

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: lint-v1
      - run: cargo fmt --all --check
      - run: mbx clippy --all-targets -- -D warnings
