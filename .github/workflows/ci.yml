name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: Swatinem/rust-cache@v2
      # The hardware integration tests are #[ignore]d; nothing here needs a device.
      - name: Test workspace
        if: runner.os != 'Windows'
        run: cargo test --workspace
      - name: Test workspace without the Rails extension
        if: runner.os == 'Windows'
        run: cargo test --workspace --exclude hx-ruby

  # `cargo test --workspace` compiles the extension, which says nothing about
  # whether the *gem* is still shippable: the package carries only the files the
  # gemspec lists, and its Cargo.toml has to resolve with no workspace around
  # it. Building and loading it here is what catches a manifest that only works
  # in this checkout.
  gem:
    name: gem
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/hx-ruby
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # ext/hx_ruby/Cargo.toml is copied into the gem and compiled where there is
      # no workspace and no sibling crate. Anything that only resolves inside
      # this checkout - a path dependency, or a value inherited from the
      # workspace - is an error there and nowhere else, which is how one reached
      # a release: `edition.workspace = true` built fine here and failed with
      # "failed to find a workspace root" the moment the gem was installed.
      - name: The gem's manifest stands on its own
        run: |
          set -euo pipefail
          fail=0
          if grep -nE '^[^#]*path *=' ext/hx_ruby/Cargo.toml; then
            echo "^ path dependency: points at nothing once the gem is unpacked" >&2
            fail=1
          fi
          if grep -nE '^[^#]*workspace *= *true|^[^#]*\.workspace' ext/hx_ruby/Cargo.toml; then
            echo "^ workspace inheritance: there is no workspace to inherit from" >&2
            fail=1
          fi
          exit $fail
      # Three places say the version, and the two that are written by hand drift
      # silently. The gem installs the crates by version, so a mismatch resolves
      # against whatever was last published rather than what is in this commit.
      - name: Every version agrees
        run: |
          set -euo pipefail
          workspace="$(sed -n 's/^version = "\(.*\)"/\1/p' ../../Cargo.toml | head -1)"
          gem="$(ruby -Ilib -rhx_ruby/version -e 'puts HxRuby::VERSION')"
          ext="$(sed -n 's/^version = "\(.*\)"/\1/p' ext/hx_ruby/Cargo.toml | head -1)"
          echo "workspace=$workspace gem=$gem ext=$ext"
          for dep in hx-catalog hx-proto; do
            want="$(sed -n "s/^${dep} = \"\(.*\)\"/\1/p" ext/hx_ruby/Cargo.toml)"
            [ "$want" = "$workspace" ] || {
              echo "ext depends on $dep $want, workspace is at $workspace" >&2
              exit 1
            }
          done
          [ "$gem" = "$workspace" ] && [ "$ext" = "$workspace" ] || {
            echo "versions disagree" >&2
            exit 1
          }
      # Only that the package builds. Installing it would compile against the
      # crates.io copies of hx-catalog and hx-proto, which for the version being
      # developed do not exist until that version is released - so the real
      # standalone install is done by the release workflow, before it pushes,
      # which is the earliest moment it can mean anything.
      - name: Build the package
        run: gem build hx_ruby.gemspec

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
