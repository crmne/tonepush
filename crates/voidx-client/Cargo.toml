[package]
name = "voidx-client"
description = "Transport-independent client and safe device operations for Sonulab StompStation PRO"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
voidx-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Linux discovery uses sysfs directly, avoiding a system libudev build-time
# dependency while serialport still supplies native Windows and macOS support.
serialport = { version = "4.9", default-features = false }
atomic-write-file = "0.3.1"
sha2 = "0.11"
flate2 = "1"
