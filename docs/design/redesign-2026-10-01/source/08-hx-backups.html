<!doctype html><html><head><meta charset="utf-8"><title>TonePush · HX Stomp backups</title>
<link rel="stylesheet" href="assets/app.css"></head><body>
<script src="assets/icons.js"></script><script src="assets/data.js"></script><script src="assets/kit.js"></script>
<script>
TP.setup();
const { I, G } = TP;
const presets = D.hxPresets().slice(0, 22);
presets[1].sel = true;
const side = TP.sidebar({
  device: { name: 'HX Stomp', status: 'Connected · 3.80', online: true }, nav: 'device', listAside: '42 of 126', presets,
  foot: `<span class="ok row">${I('shield-check', 's14')}</span><span class="grow ell">Backed up at 14:02</span><span class="iconbtn sm">${I('settings', 's14')}</span>`,
});
const mini = TP.minideck({ slot: '01B', name: 'Plexi Crunch', chain: ['wah!', 'dist', 'amp', ['cab', 'cab'], 'delay!', 'reverb'], snap: 'Chorus' });

const head = `<div class="phead" style="padding-bottom:14px"><span class="bwell" style="--cat:var(--text-soft);background:var(--raised);border-color:var(--line-strong)">${I('tp-pedal', 's20')}</span>
  <div><div class="ph1">HX Stomp</div><div class="phsub">Firmware 3.80 · 126 presets in one setlist · 4 of 128 IR slots used</div></div><span class="grow"></span>
  <span class="btn sm ghost">${I('power')}Let the pedal go</span></div>
  <div class="tabs"><span class="t on">Backups</span><span class="t">Impulse responses <span class="n">4</span></span><span class="t">Favorite blocks <span class="n">3</span></span><span class="t">Global EQ</span><span class="t">Settings</span><span class="t">Activity</span></div>`;

const hist = [
  ['Today, 14:02', 'Kept current', 'Refreshed after saving 01B', true],
  ['Today, 13:58', 'Pedal connected', 'Read in 4 seconds', false],
  ['4 Oct, 18:02', 'Before a setlist', 'Before Album release show was written', false, true],
  ['3 Oct, 21:11', 'Pedal connected', '', false],
  ['28 Sep, 10:02', 'Saved to a file', 'hx-stomp-before-tour.hxbundle', false],
  ['21 Sep, 19:40', 'Pedal connected', '', false],
  ['14 Sep, 11:05', 'Pedal connected', '', false],
];
const rows = hist.map(([when, what, note, cur, sel]) => `<div class="tr ${sel ? 'sel' : ''}" style="height:44px">
  <span class="c" style="width:120px;color:var(--text);font-weight:500">${when}</span>
  <span class="c" style="width:250px"><div style="color:var(--text);line-height:17px">${what}${cur ? ' <span class="chip ok" style="height:18px;margin-left:4px">Current</span>' : ''}</div>${note ? `<div class="muted" style="font-size:11.5px;line-height:15px">${note}</div>` : ''}</span>
  <span class="c muted" style="width:170px">126 presets · 4 IRs</span>
  <span class="c ok row" style="width:90px;gap:5px;color:var(--ok)">${I('check', 's13')}Verified</span></div>`).join('');

const left = `<div class="grow" style="min-width:0;padding:16px 20px;display:flex;flex-direction:column;gap:14px;overflow:hidden">
  <div class="banner ok"><span class="bi">${I('shield-check', 's18')}</span><div class="grow"><div class="bt">Everything on this HX Stomp is backed up</div>
    <div class="bd">TonePush reads the whole pedal when it connects and keeps that copy current after every save: 126 presets, 4 impulse responses and 154 settings, byte for byte.</div>
    <div class="row" style="gap:8px;margin-top:12px"><span class="btn sm">${I('download')}Back up to a file…</span><span class="btn sm">${I('history')}Restore from a file…</span></div></div></div>
  <div class="card" style="overflow:hidden"><div class="th"><span class="c" style="width:120px">When</span><span class="c" style="width:250px">Why it was taken</span><span class="c" style="width:170px">Holds</span><span class="c" style="width:90px">Checked</span></div>${rows}</div></div>`;

const diffs = [['02B', 'Ambient Swell', 'edited since'], ['05A', 'Shimmer Pad', 'edited since'], ['09C', 'Crunch Stack', 'edited since'], ['11B', 'Sparkle Verb', 'was Night Verb'], ['14A', 'Reverse Swell', 'added since'], ['14B', 'Practice Clean', 'added since']];
const insp = `<aside class="insp" style="width:340px">
  <div class="ih"><div style="font-size:15px;font-weight:600">4 Oct, 18:02</div><div class="pmeta">Taken before Album release show was written</div></div>
  <div class="is"><div class="lbl">Against the pedal now</div>
    <div class="row" style="gap:8px;font-size:12.5px;color:var(--text-soft);margin-bottom:8px">${I('git-compare', 's14')}<span><b style="color:var(--text);font-weight:600">6 presets differ.</b> 120 are the same.</span></div>
    ${diffs.map(([sl, nm, why]) => `<div class="row" style="height:30px;gap:10px;font-size:12.5px"><span class="muted num" style="width:28px;font-weight:500">${sl}</span><span style="flex:1;min-width:0" class="ell">${nm} <span class="muted">${why}</span></span><span class="btn sm ghost" style="height:24px;padding:0 7px">Restore</span></div>`).join('')}</div>
  <div class="is"><div class="col" style="gap:8px"><span class="btn" style="justify-content:center">${I('history')}Restore these 6 presets…</span>
    <span class="btn ghost" style="justify-content:center">Restore the whole pedal…</span>
    <span class="btn ghost" style="justify-content:center">${I('folder-open')}Show in folder</span></div></div>
</aside>`;

TP.mount(`<div class="win">${side}<div class="main">${mini}${head}<div class="libbody">${left}${insp}</div></div></div>`);
</script></body></html>
