<!doctype html><html><head><meta charset="utf-8"><title>TonePush · PRO firmware update, 1 back up</title>
<link rel="stylesheet" href="assets/app.css"></head><body>
<script src="assets/icons.js"></script><script src="assets/data.js"></script><script src="assets/kit.js"></script><script src="assets/pro.js"></script>
<script>
TP.setup();
const { I } = TP;
const plan = [
  ['now', 'Back up the pedal', 'about 40 seconds'],
  ['wait', 'Start it in Update Mode', 'you switch it off and on'],
  ['wait', 'Write the firmware', 'about 3 minutes'],
  ['wait', 'Restart the pedal', 'the new firmware starts'],
  ['wait', 'Check', 'TonePush backs up again on 2.2.6'],
].map(([st, t, d], i) => `<div class="row" style="gap:12px;height:34px"><span class="step ${st}"><span class="b">${i + 1}</span></span><span style="font-weight:${st === 'now' ? 600 : 500};color:${st === 'now' ? 'var(--text)' : 'var(--text-soft)'}">${t}</span><span class="muted">${d}</span></div>`).join('');
const backup = `<div style="width:350px;flex:none;border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--bg)">
  <div class="row" style="gap:8px"><span style="font-weight:600">Backing up</span><span class="grow"></span><span class="num muted">58%</span></div>
  <div class="progress" style="margin:10px 0 12px"><span class="f" style="width:58%"></span></div>
  <div class="checkrow done"><span class="ci">${I('check', 's14')}</span>Presets<span class="r num">60 of 60</span></div>
  <div class="checkrow done"><span class="ci">${I('check', 's14')}</span>Settings<span class="r">safe ones</span></div>
  <div class="checkrow now"><span class="ci" style="color:var(--accent)">${I('loader-circle', 's14')}</span>NAM amps<span class="r num">9 of 14</span></div>
  <div class="checkrow wait"><span class="ci">${I('circle', 's12')}</span>NAM drives<span class="r num">9</span></div>
  <div class="checkrow wait"><span class="ci">${I('circle', 's12')}</span>Impulse responses<span class="r num">11</span></div>
  <div style="font-size:11.5px;color:var(--muted);margin-top:10px;line-height:16px">Each slot is read back and checked. The bundle stays private on this computer.</div></div>`;
const body = `<div style="padding:22px 22px 20px;display:flex;gap:30px">
  <div class="grow" style="min-width:0"><div style="font-size:19px;font-weight:600;letter-spacing:-0.01em">Update to firmware 2.2.6</div>
    <div style="font-size:13px;color:var(--text-soft);line-height:19px;margin-top:6px;max-width:440px">From 1.5.12. TonePush backs up everything on the pedal first, then walks you through Sonulab's update steps and checks the result.</div>
    <div class="caps" style="margin:18px 0 6px">What happens</div>${plan}</div>${backup}</div>`;
const footer = `<span class="note" style="display:flex;gap:8px;align-items:center">${I('usb', 's14')}Use the USB cable and keep VoidX Control closed.</span><span class="grow"></span><span class="btn">Cancel</span><span class="btn primary disabled">Continue</span>`;
TP.mount(PRO.fwPage({ states: ['now'], body, footer, miniText: 'Velvet Drive stays on the pedal while TonePush backs it up.' }));
</script></body></html>
