title: TonePush Editor
tonepush_version: "0.5.5"
description: The open-source editor for Line 6 HX pedals.
lang: en-US
timezone: Europe/Berlin
url: https://docs.tonepush.rocks
baseurl: ""
logo: /assets/images/logo.svg
image: /screenshot.png

markdown: kramdown
kramdown:
  input: GFM

permalink: pretty
theme: jekyll-vitepress-theme

collections:
  guide:
    output: true
    permalink: "/:name/"
  reference:
    output: true
    permalink: "/:name/"

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /screenshot.png
      topics:
        - Line 6
        - HX Stomp
        - Helix
        - guitar effects
        - preset editor
  - scope:
      type: guide
    values:
      layout: default
  - scope:
      type: reference
    values:
      layout: default

jekyll_vitepress:
  seo:
    page_type: TechArticle
    image:
      path: /screenshot.png
      alt: TonePush Editor for Line 6 HX-family devices
    publisher:
      type: Organization
      name: TonePush
      url: https://docs.tonepush.rocks
      logo: /assets/images/logo.svg
      same_as:
        - https://github.com/crmne/tonepush
  llms:
    title: TonePush Editor
    description: >-
      Documentation for TonePush, the open-source editor for Line 6 HX-family
      devices with a cross-platform GUI, scriptable CLI, and protocol reference.
    full: true
    details: >-
      The canonical documentation covers installation, device workflows,
      presets, impulse responses, command-line automation, and the
      reverse-engineered protocol. Source is on [GitHub](https://github.com/crmne/tonepush).
  branding:
    site_title: TonePush Editor
    logo:
      default: /assets/images/logo.svg
      alt: TonePush
  syntax:
    light_theme: github
    dark_theme: github.dark
  footer:
    enabled: true
    show_on_docs: false
    message: >-
      Brought to you by <a href="https://paolino.me" target="_blank" rel="noreferrer">Carmine Paolino</a>, maker of
    copyright: >-
      <span class="footer-brand-links"><a href="https://chatwithwork.com" class="footer-chatwithwork-link" target="_blank" rel="noreferrer"><img class="footer-chatwithwork-logo theme-image light" src="https://chatwithwork.com/logotype.svg" alt="Chat with Work"><img class="footer-chatwithwork-logo theme-image dark" src="https://chatwithwork.com/logotype-dark.svg" alt="Chat with Work"></a><a href="https://rubyllm.com" class="footer-rubyllm-link" target="_blank" rel="noreferrer"><img class="footer-rubyllm-logo theme-image light" src="https://rubyllm.com/assets/images/logotype.svg" alt="RubyLLM"><img class="footer-rubyllm-logo theme-image dark" src="https://rubyllm.com/assets/images/logotype_dark.svg" alt="RubyLLM"></a></span><br><span class="footer-built-with">Docs built with <a href="https://jekyll-vitepress.dev" target="_blank" rel="noreferrer">Jekyll VitePress</a>. "Line 6", "Helix" and "HX Stomp" are trademarks of Yamaha Guitar Group; this project is not affiliated with or endorsed by them.</span>
  doc_footer:
    enabled: true
    previous_label: Previous page
    next_label: Next page
  last_updated:
    enabled: true
    text: Last updated
    format: "%Y-%m-%d %H:%M"
  edit_link:
    enabled: true
    pattern: "https://github.com/crmne/tonepush/edit/main/docs/:path"
    text: Edit this page on GitHub
  github_star:
    enabled: true
    repository: crmne/tonepush
    text: Star
    show_count: true
  github_sponsor:
    enabled: true
    user: crmne
    text: Sponsor

plugins:
  - jekyll-vitepress-theme
  - jekyll-redirect-from

exclude:
  - _site
  - .jekyll-cache
  - .sass-cache
  - .bundle
  - vendor
  - Gemfile
  - Gemfile.lock
