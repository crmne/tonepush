[workspace]
resolver = "2"
members = [
    "crates/hx-proto",
    "crates/hx-usb",
    "crates/voidx-proto",
    "crates/voidx-client",
    "crates/tonepush-cli",
    "crates/hx-catalog",
    "crates/tonepush-gui",
    "crates/hx-ruby/ext/hx_ruby",
]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/crmne/tonepush"
rust-version = "1.87"

[workspace.dependencies]
hx-proto = { path = "crates/hx-proto", version = "0.6.0" }
hx-usb = { path = "crates/hx-usb", version = "0.6.0" }
hx-catalog = { path = "crates/hx-catalog", version = "0.6.0" }
voidx-proto = { path = "crates/voidx-proto", version = "0.6.0" }
voidx-client = { path = "crates/voidx-client", version = "0.6.0" }
nusb = "0.2"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The Ruby extension names hx-catalog and hx-proto by version rather than by
# path, because its manifest is copied into the gem and compiled where no
# sibling crate exists. That would otherwise mean building this workspace
# against the last published crates instead of the working tree. Patching them
# back to the local sources keeps `cargo build` here meaning what it has always
# meant, while the gem still resolves them from crates.io.
[patch.crates-io]
# winit 0.30.13 plus Wayland `Occluded` events for the xdg-shell suspended
# state, without a redraw request while suspended. eframe then stops painting
# a hidden window instead of blocking in eglSwapBuffers, so vsync stays safe on
# Wayland. Proposed upstream as rust-windowing/winit#4709; drop the fork when a
# release includes it.
winit = { git = "https://github.com/crmne/winit", rev = "c8df61a52b8b563e1bb65e0f1d8630289d1c1bd6" }
hx-proto = { path = "crates/hx-proto" }
hx-catalog = { path = "crates/hx-catalog" }
