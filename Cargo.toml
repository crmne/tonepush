[workspace]
resolver = "2"
members = [
    "crates/hx-proto",
    "crates/hx-usb",
    "crates/voidx-proto",
    "crates/voidx-client",
    "crates/tonepush-cli",
    "crates/hx-catalog",
    "crates/tonepush-gui",
    "crates/hx-ruby/ext/hx_ruby",
]

[workspace.package]
version = "0.8.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/crmne/tonepush"
rust-version = "1.87"

[workspace.dependencies]
hx-proto = { path = "crates/hx-proto", version = "0.8.0" }
hx-usb = { path = "crates/hx-usb", version = "0.8.0" }
hx-catalog = { path = "crates/hx-catalog", version = "0.8.0" }
voidx-proto = { path = "crates/voidx-proto", version = "0.8.0" }
voidx-client = { path = "crates/voidx-client", version = "0.8.0" }
nusb = "0.2"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The Ruby extension names hx-catalog and hx-proto by version rather than by
# path, because its manifest is copied into the gem and compiled where no
# sibling crate exists. That would otherwise mean building this workspace
# against the last published crates instead of the working tree. Patching them
# back to the local sources keeps `cargo build` here meaning what it has always
# meant, while the gem still resolves them from crates.io.
[patch.crates-io]
hx-proto = { path = "crates/hx-proto" }
hx-catalog = { path = "crates/hx-catalog" }

# crmne/egui apps-0.36, shared with ZapFast, Spotifast and RekordFlash: egui
# 0.36.1 with right-to-left shaping (emilk/egui#8577), egui's busy-loop fix
# (emilk/egui#8398), and eframe pacing Wayland frames by the compositor's frame
# callbacks, so a window the compositor stops showing never blocks in a vsync
# swap (emilk/egui#8631). On Wayland, egui-winit uses winit's clipboard (see
# winit below), and each emoji cluster is laid out one emoji wide. Every egui
# crate comes from the same revision so they share one emath and epaint. Drop
# this once egui releases these.
ecolor = { git = "https://github.com/crmne/egui", rev = "61a38149a4010ff9b8257dc6a03b98818b98fd02" }
eframe = { git = "https://github.com/crmne/egui", rev = "61a38149a4010ff9b8257dc6a03b98818b98fd02" }
egui = { git = "https://github.com/crmne/egui", rev = "61a38149a4010ff9b8257dc6a03b98818b98fd02" }
egui-wgpu = { git = "https://github.com/crmne/egui", rev = "61a38149a4010ff9b8257dc6a03b98818b98fd02" }
egui-winit = { git = "https://github.com/crmne/egui", rev = "61a38149a4010ff9b8257dc6a03b98818b98fd02" }
egui_extras = { git = "https://github.com/crmne/egui", rev = "61a38149a4010ff9b8257dc6a03b98818b98fd02" }
egui_glow = { git = "https://github.com/crmne/egui", rev = "61a38149a4010ff9b8257dc6a03b98818b98fd02" }
# Test only: renders the editor offscreen for the design screenshots.
egui_kittest = { git = "https://github.com/crmne/egui", rev = "61a38149a4010ff9b8257dc6a03b98818b98fd02" }
emath = { git = "https://github.com/crmne/egui", rev = "61a38149a4010ff9b8257dc6a03b98818b98fd02" }
epaint = { git = "https://github.com/crmne/egui", rev = "61a38149a4010ff9b8257dc6a03b98818b98fd02" }
epaint_default_fonts = { git = "https://github.com/crmne/egui", rev = "61a38149a4010ff9b8257dc6a03b98818b98fd02" }
# crmne/winit apps-0.30, shared with the same apps: winit 0.30.13 plus Wayland
# `Occluded` for the xdg-shell suspended state with commits on the app's behalf
# while it isn't presenting (rust-windowing/winit#4709, #4710), which eframe
# from the fork above uses. Its other change (macOS Quit through close requests
# behind a feature) is unused here. On Wayland it reports dropped files and
# offers the clipboard through one data device, which the egui fork above
# uses: Hyprland sends the selection and drags only to a client's first data
# device, so a second one for the clipboard broke paste (crmne/spotifast#614).
# Drop the fork when a winit release includes the Wayland changes.
winit = { git = "https://github.com/crmne/winit", rev = "fb8b24c3ec3f2c499daa92aeb4e783a8efa2e973" }
